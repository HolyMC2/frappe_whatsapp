name: Pylint

# Upstream lint (Python 3.8-3.10 over every file). Release lanes are gated by
# release-ci.yml (ruff E9/F63/F7/F82/F821, compileall, bench-free suite) instead:
# this job is red on arrival there, and a red run on a release SHA hides the real gate.
on:
  push:
    branches-ignore: ['release/full-ci-*']

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10"]
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
    - name: Analysing the code with pylint
      run: |
        pylint $(git ls-files '*.py')
